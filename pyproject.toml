[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-security-harness"
version = "0.1.0"
description = "A governed, model-neutral cloud security agent runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3", "typer>=0.12,<1", "PyYAML>=6,<7",
  "mcp>=1.12,<2", "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2", "httpx>=0.27,<1", "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[project.scripts]
harness = "harness.cli:app"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["harness*", "mcp_servers*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
