name: Harness checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -c constraints-dev.txt -e '.[dev]'
      - run: ruff check src tests mcp_servers
      - run: pytest --cov=harness --cov-report=term-missing
        env:
          HARNESS_TRACE_CONSOLE: 'false'
      - run: harness eval run
        env:
          HARNESS_TRACE_CONSOLE: 'false'
